version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./catalogs:/app/catalogs
      - tone-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CATALOGS_DIR=/app/catalogs
      - MAX_UPLOAD_MB=50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis para fila de jobs (Fase 2 — Celery)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

  # Celery worker para processamento pesado (Fase 2)
  # worker:
  #   build:
  #     context: ./backend
  #     dockerfile: docker/Dockerfile
  #   command: celery -A app.core.celery worker --loglevel=info
  #   depends_on:
  #     - redis
  #   volumes:
  #     - ./backend/app:/app/app
  #     - ./catalogs:/app/catalogs

networks:
  default:
    name: ai-tone-studio

volumes:
  tone-data:
